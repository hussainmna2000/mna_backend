services:
  - type: web
    name: mna-realestate-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mna-realestate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ADMIN_EMAIL
        value: admin@mna-realestate.com
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: mna-realestate-db
    databaseName: mna_realestate
    user: mna_user
    plan: starter
